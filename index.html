<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Chat - Neon Theme</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <aside class="sidebar">
      <h2>Chats</h2>
      <ul id="userList">
        <!-- User list dynamically load hoga -->
      </ul>
    </aside>

    <main class="chat-area">
      <header>
        <div class="profile">
          <img id="chatUserPhoto" src="https://via.placeholder.com/50" alt="User" />
          <div>
            <h3 id="chatUserName">Yogesh</h3>
            <span class="status">Active Now</span>
          </div>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <footer>
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="sendBtn">➤</button>
      </footer>
    </main>

    <aside class="info-panel">
      <h3>Profile Info</h3>
      <img src="https://via.placeholder.com/80" class="avatar" />
      <p><b>Yogesh Patel</b></p>
      <p class="status active">Online</p>

      <h4>Attachments</h4>
      <div class="attachments">
        <div class="file">📎</div>
        <div class="file">🎵</div>
        <div class="file">📷</div>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
