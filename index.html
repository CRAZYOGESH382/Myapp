<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yogesh Chat - WhatsApp Style</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <aside class="sidebar">
      <header>
        <h2>Yogesh Chat 💬</h2>
      </header>
      <div class="contacts" id="userList">
        <p><b>Contacts</b></p>
        <div class="user">Radhika ❤️</div>
        <div class="user">Yogesh (You)</div>
      </div>
    </aside>

    <main class="chat-area">
      <header class="chat-header">
        <div class="chat-user-info">
          <img src="https://i.pravatar.cc/50?img=12" alt="user" />
          <div>
            <h3 id="chatUserName">Radhika ❤️</h3>
            <span class="status">Online</span>
          </div>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <footer class="chat-input">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="sendBtn">Send</button>
      </footer>
    </main>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
