<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loginBox" class="box">
    <h2>🔐 Login / Signup</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password (min 6 letters)">
    <button onclick="login()">Login / Signup</button>
    <p id="errorMsg" style="color:red;"></p>
  </div>

  <div id="chatBox" class="box" style="display:none;">
    <h2>💬 Private Chat</h2>
    <div id="messages" class="messages"></div>
    <input type="text" id="messageInput" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- ✅ Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // 🔥 Firebase Configuration (तुम्हारे Firebase Console से)
    const firebaseConfig = {
      apiKey: "AIzaSyDS0qwZFuNE3fR7dDpTz_Sr7NrtqEgAorU",
      authDomain: "privetchatapp.firebaseapp.com",
      databaseURL: "https://privetchatapp-default-rtdb.firebaseio.com",
      projectId: "privetchatapp",
      storageBucket: "privetchatapp.firebasestorage.app",
      messagingSenderId: "590135835173",
      appId: "1:590135835173:web:70d46a34d53af9b2f59dcc",
      measurementId: "G-J9SMFCJTCR"
    };

    // 🔗 Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    const loginBox = document.getElementById("loginBox");
    const chatBox = document.getElementById("chatBox");
    const messagesDiv = document.getElementById("messages");
    const msgInput = document.getElementById("messageInput");
    const errorMsg = document.getElementById("errorMsg");

    // 🔐 Login or Signup Function
    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (password.length < 6) {
        errorMsg.innerText = "⚠️ Password कम से कम 6 अक्षरों का होना चाहिए!";
        return;
      }

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(() => loadChat())
        .catch(() => {
          firebase.auth().createUserWithEmailAndPassword(email, password)
            .then(() => loadChat())
            .catch((error) => {
              errorMsg.innerText = "❌ " + error.message;
            });
        });
    }

    // 📤 Send Message
    function sendMessage() {
      const message = msgInput.value.trim();
      if (message === "") return;

      const user = firebase.auth().currentUser;
      const timestamp = new Date().toLocaleTimeString();

      firebase.database().ref("messages").push({
        user: user.email,
        text: message,
        time: timestamp
      });

      msgInput.value = "";
    }

    // 📥 Real-time Messages
    firebase.database().ref("messages").on("child_added", (snapshot) => {
      const msg = snapshot.val();
      const msgDiv = document.createElement("div");
      msgDiv.innerHTML = `<b>${msg.user}</b>: ${msg.text} <small>(${msg.time})</small>`;
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    // 🚪 Logout
    function logout() {
      firebase.auth().signOut().then(() => {
        chatBox.style.display = "none";
        loginBox.style.display = "block";
      });
    }

    // ✅ Show chat after login
    function loadChat() {
      loginBox.style.display = "none";
      chatBox.style.display = "block";
    }
  </script>

</body>
</html>
